[project]
name = "lekton"
version = "0.0.1"
description = "Claim kinds built from one primitive: a thought, and what you add to it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Wayne Grigsby" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lekton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
