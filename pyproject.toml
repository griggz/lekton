[project]
name = "lekton"
version = "0.0.2"
description = "Claim kinds built from one primitive: a thought, and what you add to it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Wayne Grigsby" }]
keywords = ["claims", "ontology", "knowledge graph", "pydantic", "agents", "llm"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/griggz/lekton"
Documentation = "https://github.com/griggz/lekton/tree/main/docs"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lekton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
